<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuenta regresiva — 5 de octubre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="strip">
    <div class="eyebrow-scene">
      <!-- Si vas a usar TU PROPIA imagen (con derechos para usarla), borra el <svg>...</svg>
           de abajo y pon en su lugar:
           <img src="tu-imagen.png" alt="Descripción" class="scene-img"> -->
      <img src="foto.jpg" alt="Snoopy con un corazón" class="scene-img">
    </div>
    <h1>Se aproxima algo</h1>
    <h1>05/10/2026 5:00 pm 🐾</h1>
    <div class="timer" id="timer">
      <div class="unit"><div class="num" id="d">00</div><div class="label">días</div></div>
      <div class="unit"><div class="num" id="h">00</div><div class="label">horas</div></div>
      <div class="unit"><div class="num" id="m">00</div><div class="label">min</div></div>
      <div class="unit"><div class="num" id="s">00</div><div class="label">seg</div></div>
    </div>

    <div class="done" id="done">
      <p class="done-msg"> FELIZ CUMPLEAÑOS! 🎉</p>
      <p class="credit">Creado por 🐾</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
